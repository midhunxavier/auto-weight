[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-weight"
version = "0.5.0"
description = "Repair fine-tuning regressions in local language model checkpoints"
readme = "README.pypi.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "rfc8785>=0.1,<1"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/midhunxavier/auto-weight"
Documentation = "https://github.com/midhunxavier/auto-weight/blob/main/docs/06-cli-and-mcp.md"
Issues = "https://github.com/midhunxavier/auto-weight/issues"

[project.optional-dependencies]
torch = ["torch>=2.5,<3"]
hf = ["torch>=2.5,<3", "transformers>=4.57.6,<5", "safetensors>=0.4,<1", "jsonschema>=4.23,<5"]
lora = ["peft>=0.18,<0.19"]
mcp = ["mcp>=1.26,<2"]
test = ["pytest>=8,<9"]

[project.scripts]
auto-weight = "auto_weight.cli:main"
auto-weight-mcp = "auto_weight.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
